{% extends 'base.html' %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 text-center">
                    <h2 class="h4 mb-3">Delete Comment</h2>
                    <p class="mb-3">Are you sure you want to delete this comment?</p>
                    
                    <div class="border p-3 mb-4 bg-light rounded text-start">
                        <small class="text-muted">{{ comment.owner.username }} said:</small>
                        <p class="mb-0 mt-1">{{ comment.content|truncatechars:200 }}</p>
                    </div>
                </div>
                <div class="card-footer d-flex gap-2 justify-content-center">
                    <a href="{% url 'about' %}" class="btn">Cancel</a>
                    <form method="post" class="mb-0">
                        {% csrf_token %}
                        <button type="submit" class="btn delete-comment-btn">Yes, Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
