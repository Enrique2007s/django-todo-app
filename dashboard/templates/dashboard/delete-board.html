{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h1 id="deleteBoardHeading" class="h2">Delete Board</h1>

                        <p id="deleteBoardDescription">Are you sure you want to delete the board "{{ board.title }}"?</p>

                        <form method="POST" action="{% url 'delete-board' board.slug %}" aria-labelledby="deleteBoardHeading" aria-describedby="deleteBoardDescription">
                            {% csrf_token %}
                            <a href="{% url 'my-dashboard' %}" class="btn cancel-button cancel-button-background">Cancel</a>
                            <button type="submit" class="btn delete-board-btn delete-board-btn-background" aria-label="Delete board {{ board.title }}">Delete Board</button>
                        </form>

                    </div>

                    <div class="text-center small text-muted">
                        Created: {{ board.created_on }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
