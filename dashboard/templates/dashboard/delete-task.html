{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h1 id="deleteTaskHeading" class="h2">Delete Task</h1>

                        <p id="deleteTaskDescription">Are you sure you want to delete the task "{{ task.title }}"?</p>

                        <form method="POST" action="{% url 'delete-task' task.id %}" aria-labelledby="deleteTaskHeading" aria-describedby="deleteTaskDescription">
                            {% csrf_token %}
                            <a href="{% url 'tasks' task.board.slug %}" class="btn btn-secondary" aria-label="Cancel and return to the task list">Cancel</a>
                            <button type="submit" class="btn btn-danger" aria-label="Delete task {{ task.title }}">Delete Task</button>
                        </form>

                    </div>

                    <div class="text-center small text-muted">
                        Created: {{ task.created_on }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
