{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="text-center mb-4">
        <h1 class="h3 mb-2 task-title">{{ board.title }}</h1>
        <p class="text-muted mb-0 task-subtitle">{{ board.excerpt }}</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h2 class="h5 mb-3">Tasks</h2>
                        <form method="POST" action="{% url 'tasks' board.slug %}">
                            {% csrf_token %}
                            {{ form.title }}
                            <input class="btn" type="submit" name="Create Task">
                        </form>

                        <div class="mt-4">
                            {% for task in tasks %}
                            <div class="task-item mb-3 p-3 border rounded">
                                <p class="mb-2 task-title-text {% if task.is_completed %}task-completed{% endif %}">{{ task.title }}</p>
                                <a href="{% url 'update-task' task.id %}" class="btn btn-sm edit-task-btn">Edit Task</a>
                                <a href="{% url 'delete-task' task.id %}" class="btn btn-sm delete-task-btn">Delete Task</a>
                                <p class="task-meta small mb-0">{{ task.created_on }}</p>
                            </div>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="text-center small text-muted">
                        <p>Board Created: {{ board.created_on }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
