{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="text-center mb-4">
        <h1 class="h3 mb-2">{{ board.title }}</h1>
        <p class="text-muted mb-0">{{ board.excerpt }}</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h2 class="h5 mb-3">Tasks</h2>
                        <form method="POST" action="{% url 'tasks' board.slug %}">
                            {% csrf_token %}
                            {{ form.title }}
                            <input class="btn" type="submit" name="Create Task">

                        </form>
                        {% for task in tasks %}
                        <p class="mb-2">{{ task.title }}</p>
                        <p class="text-muted small">{{ task.created_on }}</p>
                        {% endfor %}
                    </div>



                    <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
                        <button type="button" class="btn ">Add Task</button>
                        <button type="button" class="btn btn-outline-danger">Remove Task</button>
                    </div>

                    <div class="text-center small text-muted">
                        Created: {{ board.created_on }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
