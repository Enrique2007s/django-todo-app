{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h2 class="h5 mb-3">Edit Task</h2>
                        
                        <form method="POST" action="{% url 'update-task' task.id %}">
                            {% csrf_token %}
                            {{ form|crispy }}
                            <input class="btn" type="submit" name="Update Task">
                        </form>

                        {% for task in tasks %}
                        <p class="mb-2">{{ task.title }}</p>
                        <a href="{% url 'update-task' task.id %}" class="btn btn-sm">Edit Task</a>
                        <p class="text-muted small">{{ task.created_on }}</p>
                        {% endfor %}
                    </div>

                    <div class="text-center small text-muted">
                        Created: {{ task.created_on }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
